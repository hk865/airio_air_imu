general: 
{
   exp_dir: experiments/euroc
}

dataset:
{
   include "../datasets/EuRoC/Euroc_body.conf"
   collate: {type: motion}
}

train:
{
   network: freqimprovedrot

   lr: 1e-3
   min_lr: 1e-5
   batch_size: 128
   max_epoches: 100
   patience: 5
   factor: 0.2
   weight_decay: 1e-4

   weight: 1e2
   cov_weight: 1e-4
   propcov:True
   covaug:True
   loss: Huber_loss005
   rotloss: Huber_loss005
   
   # 位置损失参数
   posloss: False
   pos_weight: 1.0
   pos_window_size: 50 # 滑动窗口大小，每个窗口独立积分，None表示整个序列一个初始位置
   
   # Dropout参数
   dropout: 0.5   # Dropout率，默认0.3，可调整范围0.1-0.5
   
   # 姿态mask参数
   rot_mask_ratio: 0.0
   rot_mask_value: 0.0
    
   save_freq: 5
   eval_freq: 1
}