general:
{
   exp_dir: experiments/euroc/transformer
}

dataset:
{
   include "../datasets/EuRoC/Euroc_body.conf"
   collate: {type: motion}
}

train:
{
   network: simpletransformer

   # SimpleTransformerIMUModel specific parameters
   d_model: 128
   nhead: 8
   dim_feedforward: 512
   num_transformer_layers: 2
   dropout: 0.1

   lr: 1e-3
   min_lr: 1e-5
   batch_size: 64
   max_epoches: 100
   patience: 5
   factor: 0.2
   weight_decay: 1e-4

   weight: 1e2
   cov_weight: 1e-4
   propcov:True
   covaug:True
   loss: Huber_loss005
   rotloss: Huber_loss005

   save_freq: 5
   eval_freq: 1
}
