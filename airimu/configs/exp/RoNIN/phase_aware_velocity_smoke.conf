general {
  exp_dir = "experiments/RoNIN_smoke"
}

dataset {
  root_dir = "data/RoNIN"
  train_list = "configs/datasets/RoNIN/list_train.txt"
  validation_list = "configs/datasets/RoNIN/list_validation.txt"
  window_size = 400
  step_size = 200
  interval = 1
  max_velocity_norm = 3.0
  allow_missing = true
  validation_fraction = 0.2
  max_train_sequences = 2
  max_validation_sequences = 1
  max_train_windows = 4
  max_validation_windows = 2
}

model {
  input_dim = 6
  output_dim = 2
  wavelet = "db4"
  wavelet_levels = 3
  wavelet_hidden = 32
  deep_hidden = 32
  fusion_dim = 32
  lstm_layers = 1
  down_ratios = [2, 2]
  dropout = 0.1
  phase_tau = 0.5
  phase_eps = 1e-6
}

train {
  precision = "float32"
  seed = 42
  cpu_threads = 8
  num_workers = 0
  batch_size = 2
  max_epochs = 1
  lr = 3e-4
  weight_decay = 1e-5
  lr_factor = 0.5
  lr_patience = 2
  min_lr = 1e-6
  loss_crop = 8
  huber_beta = 0.1
}
