general {
  exp_dir = "experiments/RoNIN"
}

dataset {
  root_dir = "data/RoNIN"
  train_list = "configs/datasets/RoNIN/list_train.txt"
  validation_list = "configs/datasets/RoNIN/list_validation.txt"
  test_seen_list = "configs/datasets/RoNIN/list_test_seen.txt"
  test_unseen_list = "configs/datasets/RoNIN/list_test_unseen.txt"
  window_size = 400
  step_size = 100
  interval = 1
  max_velocity_norm = 3.0
  allow_missing = false
}

model {
  input_dim = 6
  output_dim = 2
  wavelet = "db4"
  wavelet_levels = 4
  wavelet_hidden = 128
  deep_hidden = 128
  fusion_dim = 128
  lstm_layers = 2
  down_ratios = [2, 2]
  dropout = 0.2
  phase_tau = 0.5
  phase_eps = 1e-6
}

train {
  precision = "float32"
  seed = 42
  cpu_threads = 8
  num_workers = 0
  batch_size = 16
  max_epochs = 100
  lr = 3e-4
  weight_decay = 1e-5
  lr_factor = 0.5
  lr_patience = 10
  min_lr = 1e-6
  loss_crop = 16
  huber_beta = 0.1
}
