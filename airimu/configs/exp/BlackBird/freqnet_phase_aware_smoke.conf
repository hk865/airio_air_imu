include "freqnet_phase_aware.conf"

general:
{
   exp_dir: experiments/BlackBird_smoke
}

dataset:
{
   collate: padding9
   train: {
      mode: mini
      calib: False
      data_list: [{name: BlackBird, window_size: 200, step_size: 200, data_root: "data/Blackbird", data_drive: [train/clover/yawForward/maxSpeed5p0]}]
   }
   test: {
      mode: mini
      calib: False
      data_list: [{name: BlackBird, window_size: 200, step_size: 200, data_root: "data/Blackbird", data_drive: [test/clover/yawForward/maxSpeed5p0]}]
   }
   eval: {
      mode: evaluate
      calib: False
      data_list: [{name: BlackBird, window_size: 200, step_size: 200, data_root: "data/Blackbird", data_drive: [eval/clover/yawForward/maxSpeed5p0]}]
   }
}

train:
{
   batch_size: 1
   max_epoches: 1
   save_freq: 1
   eval_freq: 100
   num_workers: 0
}
