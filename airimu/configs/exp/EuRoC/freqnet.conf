general: 
{
   exp_dir: experiments/EuRoC
}

dataset:
{
   include "../../datasets/BaselineEuroc/Euroc_1000.conf"
   collate: padding9
}

train:
{
   include "../../train/train_freq.conf"
   lr: 1e-3
   batch_size: 128
   rot_weight: 1.5e3
   pos_weight: 1e2
   vel_weight: 1e1
   cov_weight: 1e-4

   network: freqnet
   gtrot:True
   propcov:True
   covaug:True

   sampling: 50
   loss: Huber_loss005
   rotloss: Huber_loss005
}