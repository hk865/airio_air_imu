general: 
{
   exp_dir: experiments/EuRoC
}

dataset:
{
   include "../../datasets/BaselineEuroc/Euroc_1000.conf"
   collate: padding9
}

train:
{
   include "../../train/train_freq.conf"
   
   lr: 1e-3
   weight_decay: 1e-4
   
   batch_size: 128
   precision: float32
   seed: 42
   num_workers: 0
   cpu_threads: 8
   
   rot_weight: 1.2e3
   pos_weight: 1e2
   vel_weight: 1e1
   cov_weight: 1e-4

   network: freqnet_improved
   gtrot: True
   propcov: True
   covaug: True
   
   dropout: 0.2

   # Architecture defaults reproduce the current wavelet + phase model.
   wavelet: db4
   wavelet_levels: 4
   wavelet_hidden: 128
   deep_hidden: 128
   fusion_dim: 128
   lstm_layers: 2
   down_ratios: [2, 2]
   level_aggregation: sum

   # Float32-safe range applied before exponentiating learned log variance.
   # The -5 offset preserves the original implementation's initialization.
   cov_logvar_offset: -5.0
   cov_log_min: -18.0
   cov_log_max: 10.0

   sampling: 50
   loss: Huber_loss005
   rotloss: Huber_loss005
}
