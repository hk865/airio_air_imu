general: 
{
   exp_dir: experiments/EuRoC
}

dataset:
{
   include "../../datasets/BaselineEuroc/Euroc_1000.conf"
   collate: padding9
}

train:
{
   include "../../train/train.conf"
   
   # 学习率设置 (小波模型通常需要稍小的学习率)
   lr: 1e-3
   weight_decay: 1e-4
   
   batch_size: 128
   
   # 损失权重
   rot_weight: 1e3
   pos_weight: 1e2
   vel_weight: 1e1
   cov_weight: 1e-4

   # 网络配置
   network: wavenet_v1
   gtrot: True
   propcov: True
   covaug: True
   
   # 模型特定参数
   dropout: 0.3

   sampling: 50
   loss: Huber_loss005
   rotloss: Huber_loss005
}
