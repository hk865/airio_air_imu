include "freqnet_improved.conf"

general:
{
   exp_dir: experiments/EuRoC_smoke
}

dataset:
{
   collate: padding9

   train:
   {
      mode: mini
      calib: False
      data_list: [{
         name: Euroc
         window_size: 200
         step_size: 200
         data_root: "data/EuRoC"
         data_drive: [MH_01_easy]
      }]
   }

   test:
   {
      mode: mini
      calib: False
      data_list: [{
         name: Euroc
         window_size: 200
         step_size: 200
         data_root: "data/EuRoC"
         data_drive: [MH_01_easy]
      }]
   }

   eval:
   {
      mode: evaluate
      calib: False
      data_list: [{
         name: Euroc
         window_size: 200
         step_size: 200
         data_root: "data/EuRoC"
         data_drive: [MH_02_easy]
      }]
   }
}

train:
{
   batch_size: 1
   max_epoches: 1
   save_freq: 1
   eval_freq: 100
   num_workers: 0
   cpu_threads: 8
   sampling: 50
}
